<section class="bg-gradient-to-b from-brand/5 to-slate-50 pb-2 pt-8 text-center sm:pt-12">
  <div class="mx-auto max-w-2xl px-4 sm:px-6 lg:px-8">
    <p class="mb-3 text-[11px] font-bold uppercase tracking-[0.12em] text-brand">Conheça o time</p>
    <h1 class="text-3xl font-black tracking-tight text-slate-900 md:text-4xl">Equipe</h1>
    <p class="mt-4 text-sm leading-relaxed text-slate-600 md:text-base">
      O NewsTrust é fruto de uma colaboração entre pesquisadores e engenheiros comprometidos com o combate à
      desinformação.
    </p>
  </div>
</section>

<div class="mx-auto max-w-4xl px-4 pb-12 pt-6 sm:px-6 lg:px-8">
  <h2 class="mb-5 text-lg font-extrabold tracking-tight text-slate-900">Equipe principal</h2>

  <div class="grid items-stretch gap-6 sm:grid-cols-2">
    @for (membro of team; track membro.nome) {
      <article class="flex h-full flex-col overflow-hidden rounded-[20px] border border-slate-200 bg-white shadow-sm">
        <div
          class="flex h-20 items-end px-6"
          [style.background]="'linear-gradient(135deg, ' + membro.color + '20, ' + membro.color + '08)'"
        >
          <img
            [src]="membro.foto"
            [alt]="membro.nome"
            class="h-16 w-16 translate-y-8 rounded-2xl border-[3px] border-white object-cover object-top shadow-md"
          />
        </div>
        <div class="flex flex-1 flex-col gap-2 px-6 pb-6 pt-12">
          <h3 class="text-[15px] font-extrabold leading-snug text-slate-900">{{ membro.nome }}</h3>
          <span
            class="inline-flex w-fit rounded-full px-2.5 py-1 text-xs font-semibold"
            [style.backgroundColor]="membro.color + '15'"
            [style.color]="membro.color"
          >
            {{ membro.role }}
          </span>
          <p class="min-h-[4.5rem] flex-1 text-[13px] leading-relaxed text-slate-600">{{ membro.bio }}</p>
          <a
            [href]="membro.lattes"
            target="_blank"
            rel="noopener noreferrer"
            class="mt-auto pt-1 text-xs font-semibold text-brand hover:underline"
          >
            Ver Currículo Lattes →
          </a>
        </div>
      </article>
    }
  </div>
</div>
