<div class="space-y-6">
  <h3 class="flex items-center text-lg font-semibold text-slate-900 sm:text-xl">
    <app-icon name="globe" [size]="22" class="mr-2 text-brand sm:mr-3" />
    Análise de Fonte
  </h3>

  <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4 sm:space-y-6" novalidate>
    <div>
      <label for="url" class="mb-2 block text-sm font-medium text-slate-700 sm:mb-3 sm:text-base">
        URL da Fonte
      </label>
      <input
        id="url"
        type="text"
        formControlName="url"
        placeholder="https://exemplo.com"
        class="w-full rounded-lg border px-3 py-3 text-sm transition-all duration-200 focus:border-transparent focus:ring-2 focus:ring-brand/30 focus:outline-none sm:px-5 sm:py-4 sm:text-base lg:text-lg"
        [class.border-red-500]="form.controls.url.invalid && form.controls.url.touched"
        [class.border-slate-300]="!(form.controls.url.invalid && form.controls.url.touched)"
        [attr.aria-invalid]="form.controls.url.invalid && form.controls.url.touched"
        aria-describedby="url-error"
      />
      @if (form.controls.url.invalid && form.controls.url.touched) {
        <p id="url-error" class="mt-1 text-xs font-medium text-red-600">
          Informe uma URL válida (ex: https://exemplo.com).
        </p>
      }
    </div>

    <div class="flex flex-col gap-3 sm:flex-row sm:gap-4">
      <button
        type="submit"
        [disabled]="submitting()"
        class="flex flex-1 items-center justify-center rounded-lg bg-gradient-to-r from-brand to-brand-dark px-4 py-3.5 text-sm font-semibold text-white shadow-md transition-all duration-300 hover:from-brand-dark hover:to-brand-dark disabled:cursor-not-allowed disabled:opacity-60 sm:px-6 sm:py-4 sm:text-base lg:py-5 lg:text-lg"
      >
        <app-icon name="globe" [size]="20" class="mr-2 sm:mr-3" />
        Analisar Fonte
      </button>
      <button
        type="button"
        (click)="clear()"
        [disabled]="submitting()"
        class="flex items-center justify-center rounded-lg bg-red-500 px-4 py-3.5 text-sm font-semibold text-white shadow-md transition-all duration-300 hover:bg-red-600 disabled:cursor-not-allowed disabled:opacity-60 sm:px-6 sm:py-4 sm:text-base lg:py-5 lg:text-lg"
      >
        <app-icon name="trash" [size]="18" class="mr-2" />
        Limpar Formulário
      </button>
    </div>
  </form>

  @if (submitting()) {
    <app-loading-spinner label="Analisando fonte…" />
  }

  @if (errorMessage(); as message) {
    <app-error-banner [message]="message" (retry)="submit()" />
  }

  @if (result(); as analysis) {
    <div class="border-t border-blue-100 pt-6 sm:pt-8">
      <app-source-analysis-result [result]="analysis" />
    </div>
  }
</div>
