<header class="sticky top-0 z-40 border-b border-slate-200 bg-white/90 backdrop-blur-md">
  <div class="mx-auto grid h-16 max-w-7xl grid-cols-[1fr_auto_1fr] items-center gap-4 px-4 sm:px-6 lg:px-8">
    <a routerLink="/analysis" class="flex shrink-0 items-center gap-2 justify-self-start">
      <img src="/iconeNewsTrust.png" alt="NewsTrust" class="h-8 w-8" />
      <span class="text-lg font-bold text-slate-900">NewsTrust</span>
    </a>

    <nav class="hidden items-center gap-1 lg:flex" aria-label="Navegação principal">
      @for (item of items; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="active text-brand"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-link rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition-colors duration-200 hover:text-brand"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <button
      type="button"
      (click)="toggle()"
      aria-label="Menu"
      [attr.aria-expanded]="open()"
      class="justify-self-end rounded-lg border border-slate-200 bg-white p-2 shadow-sm transition hover:bg-slate-50 lg:hidden"
    >
      <app-icon [name]="open() ? 'x' : 'menu'" [size]="22" />
    </button>
  </div>
</header>

@if (open()) {
  <div class="fixed inset-0 z-40 bg-black/50 lg:hidden" (click)="close()"></div>
}

<div
  class="fixed top-0 right-0 z-50 h-full w-72 border-l border-slate-200 bg-white shadow-2xl transition-transform duration-300 ease-out sm:w-80 lg:hidden"
  [class.translate-x-0]="open()"
  [class.translate-x-full]="!open()"
  [attr.inert]="open() ? null : ''"
>
  <div class="flex items-center border-b border-slate-200 p-4 sm:p-6">
    <img src="/iconeNewsTrust.png" alt="NewsTrust" class="h-8 w-8 flex-shrink-0 sm:h-10 sm:w-10" />
    <span class="ml-3 text-lg font-bold text-slate-900 sm:text-xl">NewsTrust</span>
  </div>

  <nav class="p-3 sm:p-4">
    <ul class="space-y-1 sm:space-y-2">
      @for (item of items; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-brand/10 text-brand border border-brand/20"
            (click)="close()"
            class="flex items-center rounded-lg px-3 py-2.5 text-left text-slate-700 transition-all duration-200 hover:bg-slate-50 hover:text-slate-900 sm:px-4 sm:py-3"
          >
            <app-icon [name]="item.icon" [size]="18" />
            <span class="ml-2 text-sm font-medium sm:ml-3 sm:text-base">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
  </nav>
</div>
